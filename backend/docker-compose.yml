services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: home_management
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dev -d home_management']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO / S3-compatible entra en la Etapa 3 (docs/stack.md §3, fotos y
  # documentos). Ojo: desde septiembre 2026 MinIO ya no distribuye imágenes
  # (Docker Hub borrado, Quay exige login) — decidir la alternativa al
  # llegar la Etapa 3 (ver MEMORY.md §5).

volumes:
  pgdata:
